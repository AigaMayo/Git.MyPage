<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>おぐらのよてい</title>
    <style>
        /* カレンダーを中央寄せにし、スマホ幅でもはみ出さないように設定 */
        .calendar-container {
            max-width: 800px;
            margin: 20px auto;
            padding: 0 10px;
        }
        /* レスポンシブ対応：縦長にするために高さを広めに設定 (130%などにお好みで変更可能) */
        .calendar-wrapper {
            position: relative;
            padding-bottom: 130%; /* 数値が大きいほど縦長になります */
            height: 0;
            overflow: hidden;
        }
        .calendar-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
    </style>
</head>
<body>

    <div class="calendar-container">
        <h2>calendar</h2>
        <p>※予定の有無のみです．</p>
        
        <!-- カレンダー埋め込み部分 -->
        <div class="calendar-wrapper">
            <iframe src="https://calendar.google.com/calendar/embed?src=multiple.system.manager%40gmail.com&amp;src=ogura.kai.s3%40gmail.com&amp;src=ogura.kai.s3%40dc.tohoku.ac.jp&amp;ctz=Asia%2FTokyo&amp;mode=WEEK" scrolling="no"></iframe>
        </div>
    </div>

</body>
</html>
