<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Googleカレンダー埋め込み（複数表示）</title>
    <style>
        /* カレンダーを中央寄せにし、スマホ幅でもはみ出さないように設定 */
        .calendar-container {
            max-width: 800px;
            margin: 20px auto;
            padding: 0 10px;
        }
        /* レスポンシブ対応：画面幅に合わせて中身のiframeを伸縮させる */
        .calendar-wrapper {
            position: relative;
            padding-bottom: 75%; /* 4:3の比率 */
            height: 0;
            overflow: hidden;
        }
        .calendar-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
    </style>
</head>
<body>

    <div class="calendar-container">
        <h2>イベントスケジュール</h2>
        
        <!-- カレンダー埋め込み部分 -->
        <div class="calendar-wrapper">
            <!-- 
              複数のカレンダーをまとめる場合：
              1つの「src=カレンダーID」の後ろに「&amp;src=2つ目のカレンダーID」を次々につなげていきます。
              ※「@」が含まれるカレンダーID（通常Gmailアドレスなど）は「%40」に置き換えて指定すると確実です。
            -->
            <iframe src="https://calendar.google.com/calendar/embed?src=multiple.system.manager%40gmail.com&amp;src=ogura.kai.s3%40gmail.com&amp;ctz=Asia%2FTokyo" scrolling="no"></iframe>
        </div>
    </div>

</body>
</html>
